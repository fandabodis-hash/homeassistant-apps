name: F99 FoxESS 00018 service recovery candidate
on:
  push:
    branches:
      - fix/f99-00018-foxess-owner-recovery-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strictly offline one-use recovery guard tests
        env:
          PYTHONPATH: iqfanda-agent/rootfs/app
        run: python -m unittest discover -s iqfanda-agent/tests -p 'test_f99_00018_owner_recovery.py' -v
      - name: Compile guarded service code without device access
        run: python -m py_compile iqfanda-agent/rootfs/app/foxess_00018_owner_recovery.py iqfanda-agent/rootfs/app/foxess_zero_remote_release.py
      - name: Source integrity and append-only release guard
        run: python iqfanda-agent/scripts/check_manual_battery_release.py --base-ref 3f8920131725ab8bbe810279a178d3019cd5192f
      - name: Safety statement
        run: echo 'SOURCE TEST ONLY; NO AGENT UPDATE; NO MODBUS; NO DEVICE COMMAND'
