name: F106 Midea 00019 read-only contract
on:
  push:
    branches:
      - feature/f106-midea-00019-readonly-modbus
      - feature/f114-00015-heating-0182
  pull_request:
    paths:
      - "iqfanda-agent/rootfs/app/communication/midea_00019_readonly.py"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_live.py"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_power.py"
      - "iqfanda-agent/tests/test_f169_agent.py"
      - "iqfanda-agent/tests/test_f169_release_paths.py"
      - "iqfanda-agent/scripts/check_manual_battery_release.py"
      - "iqfanda-agent/tests/test_f152_midea_00019_live.py"
      - "iqfanda-agent/tests/test_f106_midea_00019_readonly.py"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_cloud_probe.py"
      - "iqfanda-agent/rootfs/app/command_worker.py"
      - "iqfanda-agent/rootfs/app/heartbeat.py"
      - "iqfanda-agent/rootfs/app/f114_heating_circuit_local.py"
      - "iqfanda-agent/rootfs/app/heating_circuit_controller.py"
      - "iqfanda-agent/rootfs/app/startup.py"
      - "iqfanda-agent/rootfs/app/zigbee_manager.py"
      - "iqfanda-agent/tests/test_f114*.py"
      - "iqfanda-agent/tests/test_heating_circuit_controller.py"
      - "iqfanda-agent/config.yaml"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_ftdi_inventory.py"
      - "iqfanda-agent/tests/test_f132_midea_00019_ftdi_inventory.py"
      - "iqfanda-agent/tests/test_f133_agent_0177_additive_contract.py"
      - "iqfanda-agent/docs/F133_0177_ADDITIVE_ONLY_CONTRACT_20261123.md"
      - "iqfanda-agent/tests/test_f107_midea_00019_cloud_probe.py"
      - ".github/workflows/f106-midea-00019-readonly.yml"
jobs:
  test-model-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # F133 needs exact F99-verified 0.1.176 ancestry
      - name: Python tests (no hardware, no Modbus I/O)
        run: |
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f106_midea_00019_readonly.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f107_midea_00019_cloud_probe.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f132_midea_00019_ftdi_inventory.py' -v
          version=$(cat iqfanda-agent/rootfs/app/VERSION)
          if [ "$version" = "0.1.181" ]; then
            python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f133_agent_0177_additive_contract.py' -v
          elif [ "$version" = "0.1.182" ]; then
            old=$(mktemp -d)
            rmdir "$old"
            git worktree add --detach "$old" a58969a904e9234e56912e9f9a30baa3d354b14a
            trap 'git worktree remove --force "$old"' EXIT
            (cd "$old" && python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f133_agent_0177_additive_contract.py' -v)
            PYTHONPATH=iqfanda-agent/rootfs/app python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f114_00015_release_contract.py' -v
            PYTHONPATH=iqfanda-agent/rootfs/app python3 -m unittest discover -s iqfanda-agent/tests -p 'test_heating_circuit_controller.py' -v
            PYTHONPATH=iqfanda-agent/rootfs/app python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f114_heating_circuit_local.py' -v
          else
            echo "Unreviewed successor version: $version" >&2
            exit 1
          fi
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f152_midea_00019_live.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f169_agent.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f169_release_paths.py' -v
          python3 -m py_compile iqfanda-agent/rootfs/app/command_worker.py iqfanda-agent/rootfs/app/heartbeat.py iqfanda-agent/rootfs/app/communication/midea_00019_ftdi_inventory.py
