name: F106 Midea 00019 read-only contract
on:
  push:
    branches:
      - feature/f106-midea-00019-readonly-modbus
  pull_request:
    paths:
      - "iqfanda-agent/rootfs/app/communication/midea_00019_readonly.py"
      - "iqfanda-agent/tests/test_f106_midea_00019_readonly.py"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_cloud_probe.py"
      - "iqfanda-agent/rootfs/app/command_worker.py"
      - "iqfanda-agent/rootfs/app/heartbeat.py"
      - "iqfanda-agent/rootfs/app/communication/midea_00019_ftdi_inventory.py"
      - "iqfanda-agent/tests/test_f132_midea_00019_ftdi_inventory.py"
      - "iqfanda-agent/tests/test_f133_agent_0177_additive_contract.py"
      - "iqfanda-agent/docs/F133_0177_ADDITIVE_ONLY_CONTRACT_20261123.md"
      - "iqfanda-agent/tests/test_f107_midea_00019_cloud_probe.py"
      - ".github/workflows/f106-midea-00019-readonly.yml"
jobs:
  test-model-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # F133 needs exact F99-verified 0.1.176 ancestry
      - name: Python tests (no hardware, no Modbus I/O)
        run: |
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f106_midea_00019_readonly.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f107_midea_00019_cloud_probe.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f132_midea_00019_ftdi_inventory.py' -v
          python3 -m unittest discover -s iqfanda-agent/tests -p 'test_f133_agent_0177_additive_contract.py' -v
          python3 -m py_compile iqfanda-agent/rootfs/app/command_worker.py iqfanda-agent/rootfs/app/heartbeat.py iqfanda-agent/rootfs/app/communication/midea_00019_ftdi_inventory.py
