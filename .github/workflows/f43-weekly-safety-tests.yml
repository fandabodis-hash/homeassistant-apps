name: F43 weekly relay single-owner safety tests

on:
  pull_request:
    paths:
      - 'iqfanda-agent/rootfs/app/weekly_relay_owner.py'
      - 'iqfanda-agent/rootfs/app/telemetrie_modulu.py'
      - 'iqfanda-agent/rootfs/app/pv_surplus_target_control.py'
      - 'iqfanda-agent/tests/test_f43_weekly_relay_owner.py'
      - '.github/workflows/f43-weekly-safety-tests.yml'
      - 'iqfanda-agent/config.yaml'
      - 'iqfanda-agent/rootfs/app/VERSION'
      - 'iqfanda-agent/Dockerfile'
  push:
    branches:
      - 'fix/f43-weekly-soc-ownership-20261011'

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile altered Agent files
        run: |
          python3 -B -m py_compile \
            iqfanda-agent/rootfs/app/weekly_relay_owner.py \
            iqfanda-agent/rootfs/app/telemetrie_modulu.py \
            iqfanda-agent/rootfs/app/pv_surplus_target_control.py
      - name: Pure weekly/SOC ownership regression tests
        run: |
          PYTHONPATH=iqfanda-agent/rootfs/app python3 -B -m unittest discover \
            -s iqfanda-agent/tests -p test_f43_weekly_relay_owner.py -v

  arm64-build-and-image-inspect:
    runs-on: ubuntu-latest
    needs: offline-only
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify version 0.1.145 before build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat iqfanda-agent/rootfs/app/VERSION)" = '0.1.145'
          grep -Fx 'version: "0.1.145"' iqfanda-agent/config.yaml
          grep -Fx '  software_version: "0.1.145"' iqfanda-agent/config.yaml
          test -f iqfanda-agent/rootfs/app/weekly_relay_owner.py
      - name: Build isolated arm64 add-on image (never push)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build --platform linux/arm64 --load \
            --tag f43-agent-test:0.1.145 -f iqfanda-agent/Dockerfile iqfanda-agent
      - name: Verify built architecture and source version (never start)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect f43-agent-test:0.1.145 --format '{{.Architecture}}')" = arm64
          container=$(docker create --platform linux/arm64 f43-agent-test:0.1.145)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container":/app/VERSION /tmp/f43-agent-version
          docker cp "$container":/app/weekly_relay_owner.py /tmp/f43-weekly-relay-owner.py
          test "$(cat /tmp/f43-agent-version)" = '0.1.145'
          cmp iqfanda-agent/rootfs/app/weekly_relay_owner.py /tmp/f43-weekly-relay-owner.py
          echo 'F43_ARM64_IMAGE=PASS_IMAGE_CREATED_NOT_STARTED_NOT_PUBLISHED'
